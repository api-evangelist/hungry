aid: hungry
name: HUNGRY
description: 'HUNGRY (Hungry Marketplace, Inc.) is an Arlington, Virginia workplace
  food platform that connects corporate clients to a curated network of independent
  chefs and local restaurants. Founded in 2016 by Jeff Grass, Eman Pahlavani and Shy
  Pahlevani, it operates four product lines — office catering, Group Order individual
  meal pre-ordering, live events and chef pop-ups, and snacks and pantry — plus HUNGRY
  Last Mile, its own delivery and logistics arm. The platform runs its own admin,
  chef/food-partner dashboard, client admin dashboard, ops captain app and consumer
  ordering marketplace across 24 US cities and, following the February 2026 merger
  with Toronto-based hungerhub, more than ten Canadian markets. Earlier acquisitions
  include NatureBox and Garten. HUNGRY publishes no public developer program: the
  backing API at api.tryhungry.com is a private first-party service for its own web
  and mobile clients, and no OpenAPI, GraphQL SDL, AsyncAPI, SDK or partner API
  reference is published anywhere on its public surface. The company does publish a
  dated, public engineering release-notes site, which is the only machine-adjacent
  technical artifact it makes available.'
